name: Build Irritated Fowl APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'irritatedfowl/**'
      - 'settings.gradle'
      - '.github/workflows/build-irritated-fowl.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify corrected game constructor
        run: grep -nE 'new GameView\(this\)|GameView\(Context context\)' irritatedfowl/src/main/java/com/irritatedfowl/game/GameActivity.java
      - name: Build Irritated Fowl APK
        run: gradle :irritatedfowl:assembleDebug
      - name: Upload Irritated Fowl APK
        uses: actions/upload-artifact@v4
        with:
          name: irritated-fowl-debug-apk
          path: irritatedfowl/build/outputs/apk/debug/irritatedfowl-debug.apk
          if-no-files-found: error
